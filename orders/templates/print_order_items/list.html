{% extends 'core/list.html' %}

{% block custom_list_card_buttons %}
    {% if perms.orders.change_printorderitem %}
        <button type="button" class="btn btn-warning m-1 custom-table-actions-button" style="display: none;" data-url="{% url 'orders:print_order_items_change_state_multiple' %}" data-form-url="{% url 'orders:print_order_items_change_state_form' %}" data-text="Seleccione el nuevo estado para las impresiones elegidas." data-modal-type="warning">
            <i class="fas fa-exchange-alt"></i> Cambiar estado
        </button>
        <button type="button" class="btn btn-info m-1 custom-table-actions-button" style="display: none;" data-url="{% url 'orders:print_order_items_change_color_multiple' %}" data-form-url="{% url 'orders:print_order_items_change_color_form' %}" data-text="Seleccione el color para las impresiones elegidas." data-modal-type="info">
            <i class="fas fa-palette"></i> Especificar color
        </button>
    {% endif %}
{% endblock %}

{% block table_headers %}
    <th>
        <div class="custom-control custom-checkbox">
            <input class="custom-control-input custom-control-input-lightblue" type="checkbox" id="select-all-items-checkbox">
            <label for="select-all-items-checkbox" class="custom-control-label"></label>
        </div>
    </th>
    <th>Horas</th>
    <th>Minutos</th>
    <th>Gramos</th>
    <th>Material</th>
    <th>Color</th>
    <th>Estado</th>
    <th>Acciones</th>
{% endblock %}

{% block list_footer %}
    <div class="row">
        <div class="col-12 text-center">
            <a class="btn btn-outline-secondary" href="{% url 'orders:items' object.order.id %}"><i class="fas fa-caret-left"></i> Volver</a>
        </div>
    </div>
{% endblock%}
