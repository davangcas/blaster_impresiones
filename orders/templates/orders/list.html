{% extends 'core/list_with_filters.html' %}
{% load static %}

{% block custom_list_card_buttons %}
    {% if perms.orders.delete_order %}
        <button type="button" class="btn btn-danger m-1 custom-table-actions-button" style="display: none;" data-url="{% url 'orders:delete_multiple' %}" data-text="¿Desea eliminar los pedidos seleccionados?" data-modal-type="danger">
            <i class="fas fa-trash"></i> Eliminar
        </button>
    {% endif %}
{% endblock %}

{% block filter_inputs %}
    <div class="col-6">
        <div class="input-group date mt-2" id="start_date" data-target-input="nearest">
            <input type="text" class="form-control datetimepicker-input table-filter" data-target="#start_date" name="created__gte" placeholder="Fecha inicio">
            <div class="input-group-append" data-target="#start_date" data-toggle="datetimepicker">
                <div class="input-group-text"><i class="fa fa-calendar"></i></div>
            </div>
        </div>
    </div>
    <div class="col-6">
        <div class="input-group date mt-2" id="end_date" data-target-input="nearest">
            <input type="text" class="form-control datetimepicker-input table-filter" data-target="#end_date" name="created__lte" placeholder="Fecha fin">
            <div class="input-group-append" data-target="#end_date" data-toggle="datetimepicker">
                <div class="input-group-text"><i class="fa fa-calendar"></i></div>
            </div>
        </div>
    </div>
{% endblock %}

{% block table_headers %}
    <th>
        <div class="custom-control custom-checkbox">
            <input class="custom-control-input custom-control-input-lightblue" type="checkbox" id="select-all-items-checkbox">
            <label for="select-all-items-checkbox" class="custom-control-label"></label>
        </div>
    </th>
    <th>Fecha de creacion</th>
    <th>Cliente</th>
    <th>Estado</th>
    <th>Total</th>
    <th>Acciones</th>
{% endblock %}
