{% load static %}

<div class="main-content-wrapper d-flex clearfix">
    <div class="mobile-nav">
        <div class="amado-navbar-brand">
            <a href="#"><img src="{% static 'lib/amado-furniture/img/core-img/logo.png' %}" alt="" /></a>
        </div>

        <div class="amado-navbar-toggler">
            <span></span><span></span><span></span>
        </div>
    </div>

    <header class="header-area clearfix">
        <div class="nav-close">
            <i class="fa fa-close" aria-hidden="true"></i>
        </div>

        <div class="logo">
            <a href="#"><img src="{% static 'lib/amado-furniture/img/core-img/logo.png' %}" alt="" /></a>
        </div>

        <nav class="amado-nav">
            <ul>
                <li class="active"><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Product</a></li>
                <li><a href="#">Cart</a></li>
                <li><a href="{% url 'dashboard:login' %}">Admin</a></li>
            </ul>
        </nav>

        <div class="amado-btn-group mt-30 mb-100">
            <a href="#" class="btn amado-btn mb-15">%Discount%</a>
            <a href="#" class="btn amado-btn active">New this week</a>
        </div>

        <div class="cart-fav-search mb-100">
            <a href="#" class="cart-nav"
                ><img src="{% static 'lib/amado-furniture/img/core-img/cart.png' %}" alt="" /> Cart
                <span>(0)</span></a
            >
            <a href="#" class="fav-nav"
                ><img src="{% static 'lib/amado-furniture/img/core-img/favorites.png' %}" alt="" /> Favourite</a
            >
            <a href="#" class="search-nav"
                ><img src="{% static 'lib/amado-furniture/img/core-img/search.png' %}" alt="" /> Search</a
            >
        </div>

        <div class="social-info d-flex justify-content-between">
            <a href="#"><i class="fa fa-pinterest" aria-hidden="true"></i></a>
            <a href="#"><i class="fa fa-instagram" aria-hidden="true"></i></a>
            <a href="#"><i class="fa fa-facebook" aria-hidden="true"></i></a>
            <a href="#"><i class="fa fa-twitter" aria-hidden="true"></i></a>
        </div>
    </header>

    <div class="products-catagories-area clearfix">
        <div class="amado-pro-catagory clearfix">
            {% for product in products %}
                <div class="single-products-catagory clearfix">
                    <a href="#">
                        <img src="{{ product.image.url }}" alt="{{ product.name }}" />
                        <div class="hover-content">
                            <div class="line"></div>
                            <p>$ {{ product.price }}</p>
                            <h4>{{ product.name }}</h4>
                        </div>
                    </a>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
