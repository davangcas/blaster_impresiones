{% load static %}

<div class="search-wrapper section-padding-100">
    <div class="search-close">
        <i class="fa fa-close" aria-hidden="true"></i>
    </div>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="search-content">
                    <form action="#" method="get">
                        <input
                            type="search"
                            name="search"
                            id="search"
                            placeholder="Escribe lo que desees buscar"
                        />
                        <button type="submit">
                            <img
                                src="{% static 'lib/amado-furniture/img/core-img/search.png' %}"
                                alt=""
                            />
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
