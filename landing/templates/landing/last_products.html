<div class="section padding_layout_1">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="full">
                    <div class="main_heading text_align_center">
                        <h2>Últimas impresiones</h2>
                        <p class="large">Te mostramos lo realizado últimamente</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            {% for product in products %}
                <div class="col-lg-3 col-md-6 col-sm-6 col-xs-12 margin_bottom_30_all">
                    <div class="product_list">
                        <div class="product_img">
                            <img class="img-responsive" src="{{ product.image.url }}" alt="">
                        </div>
                        <div class="product_detail_btm">
                            <div class="center">
                                <h4><a href="#">{{ product.name }}</a></h4>
                            </div>
                            <div class="starratin">
                                <div class="center"> <i class="fa fa-star" aria-hidden="true"></i> <i class="fa fa-star" aria-hidden="true"></i> <i class="fa fa-star" aria-hidden="true"></i> <i class="fa fa-star" aria-hidden="true"></i> <i class="fa fa-star" aria-hidden="true"></i> </div>
                            </div>
                            <div class="product_price">
                                <p><span class="new_price">${{ product.price }}</span></p>
                            </div>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
