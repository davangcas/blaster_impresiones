services:
  web:
    build:
      context: "./"
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
    environment:
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=config.settings.development

  postgres:
    image: postgres:15.3
    ports:
      - "5431:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=blaster_impresiones
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
