[tool.black]
target-version = ['py310', 'py311']
exclude = '''
(
  /(
    postgres_data
    | venv
  )/
)
'''

[tool.isort]
profile = 'black'
skip_glob = ['venv']

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
ignore = []
extend-select = ["I"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
