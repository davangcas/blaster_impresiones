{% extends 'core/list.html' %}

{% block custom_list_card_buttons %}
    {% if perms.products.delete_category %}
        <button type="button" class="btn btn-danger m-1 custom-table-actions-button" style="display: none;" data-url="{% url 'products:categories_delete_multiple' %}" data-text="¿Desea eliminar las categorías seleccionadas?" data-modal-type="danger">
            <i class="fas fa-trash"></i> Eliminar
        </button>
    {% endif %}
{% endblock %}

{% block table_headers %}
    <th>
        <div class="custom-control custom-checkbox">
            <input class="custom-control-input custom-control-input-lightblue" type="checkbox" id="select-all-items-checkbox">
            <label for="select-all-items-checkbox" class="custom-control-label"></label>
        </div>
    </th>
    <th>Nombre</th>
    <th>Estado</th>
    <th>Acciones</th>
{% endblock %}
